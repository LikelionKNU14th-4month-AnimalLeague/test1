    function startTimer() {
      stopTimer();
      S.startTime = Date.now() - S.elapsed * 1000;
      S.timerID = setInterval(() => {
        S.elapsed = Math.floor((Date.now() - S.startTime) / 1000);
        const el = document.getElementById('stolen-time');
        if (el) el.textContent = `⏱ 지금까지 뺏긴 시간: ${fmt(S.elapsed)}`;
      }, 1000);
    }

    function stopTimer() {
      if (S.timerID) { clearInterval(S.timerID); S.timerID = null; }
    }

    function loadUser() {
      const d = JSON.parse(localStorage.getItem('animal_user') || '{}');
      S.school = d.school || '';
      S.nickname = d.nickname || '';
    }

    function saveUser() {
      localStorage.setItem('animal_user', JSON.stringify({ school: S.school, nickname: S.nickname }));
    }

    function saveRanking(entry) {
      let list = JSON.parse(localStorage.getItem('animal_rankings') || '[]');
      list.push(entry);
      list.sort((a, b) => b.seconds - a.seconds);
      localStorage.setItem('animal_rankings', JSON.stringify(list));
      return list;
    }

    function getResult() {
      const cnt = { A: 0, B: 0 };
      S.answers.forEach(a => cnt[a] = (cnt[a] || 0) + 1);
      return RESULTS[S.category][cnt.B > cnt.A ? 'B' : 'A'];
    }

    // ══════════════════════════════════════════
    // PAPER SHELL
    // ══════════════════════════════════════════

    function header(num, subject) {
      return `
        <div class="paper-top-bar">
          <span class="paper-meta">2025학년도 시험기간 도파민테스트 문제지</span>
          <span class="paper-big-num">${num}</span>
        </div>
        <hr class="div1">
        <div class="paper-subject-row">
          <span class="paper-subject">${subject}</span>
          <span class="paper-badge">홀수형</span>
        </div>
        <hr class="div2">
      `;
    }

    function footer(cur, total = 16) {
      return `
        <div class="paper-footer">
          <span>* 이 문제지에 관한 저작권은 시험기간도파민테스트에 있습니다.</span>
          <span>${cur} / ${total}</span>
        </div>
      `;
    }

    // ══════════════════════════════════════════
    // SCREENS
    // ══════════════════════════════════════════

    function renderIntro() {
      document.getElementById('paper').innerHTML = `
        ${header(1, '제 1 교시&nbsp;&nbsp;&nbsp;도파민 영역')}
        <div class="info-box">
          <div class="info-box-title">[안내문] 다음을 읽고, 정보를 입력하시오.</div>
          <div class="info-box-body">
            시험기간 도파민 테스트에 오신 것을 환영합니다. 본 테스트는 시험기간에 당신의 도파민 중독 수준을 측정하기 위해 설계되었습니다. <strong>솔직하게</strong> 답변해 주세요. 테스트 결과는 재미를 위한 것이며, 어떠한 학술적 근거도 없습니다.
            <p class="info-box-warn">※ 본 테스트를 진행하는 동안 뺏기는 시간은 측정됩니다.</p>
          </div>
        </div>
        <div class="q-item">
          <div class="q-label"><span class="q-num">1.</span><span>수험생의 <strong>학교 이름</strong>을 기입하시오.</span></div>
          <input class="q-input" id="inp-school" type="text" placeholder="예: OO고등학교, OO대학교" value="${S.school}">
        </div>
        <div class="q-item">
          <div class="q-label"><span class="q-num">2.</span><span>수험생의 <strong>닉네임</strong>을 기입하시오.</span></div>
          <input class="q-input" id="inp-nick" type="text" placeholder="닉네임을 입력하세요" value="${S.nickname}">
        </div>
        <button class="btn-next" onclick="goCategory()">다음 페이지로 →</button>
        ${footer(1)}
      `;
    }

    function goCategory() {
      const school = document.getElementById('inp-school').value.trim();
      const nick   = document.getElementById('inp-nick').value.trim();
      if (!school || !nick) { alert('학교 이름과 닉네임을 모두 입력해 주세요.'); return; }
      S.school = school; S.nickname = nick;
      saveUser();
      renderCategory();
    }

    function renderCategory() {
      // Reset quiz state
      S.questions = []; S.qIndex = 0; S.answers = [];
      S.elapsed = 0; S.midLoadingDone = false;
      stopTimer();

      document.getElementById('paper').innerHTML = `
        ${header(2, '제 2 교시&nbsp;&nbsp;&nbsp;카테고리 선택')}
        <div class="info-box">
          <div class="info-box-title">[안내문] 다음을 읽고, 카테고리를 선택하시오.</div>
          <div class="info-box-body">
            아래 3개의 카테고리 중 <strong>하나를 선택</strong>하시오. 카테고리 선택 순간부터 뺏기는 시간이 측정됩니다. 가장 솔직하게 자신을 대변하는 카테고리를 선택하세요.
          </div>
        </div>
        <div class="category-grid">
          <button class="category-btn" onclick="selectCat('love')">
            <div class="cat-circle">①</div>
            <div class="cat-name">연애</div>
            <div class="cat-desc">연인 / 짝사랑 / 설렘</div>
          </button>
          <button class="category-btn" onclick="selectCat('study')">
            <div class="cat-circle">②</div>
            <div class="cat-name">공부</div>
            <div class="cat-desc">학습 / 집중 / 의지력</div>
          </button>
          <button class="category-btn" onclick="selectCat('life')">
            <div class="cat-circle">③</div>
            <div class="cat-name">생활</div>
            <div class="cat-desc">수면 / 식사 / 루틴</div>
          </button>
        </div>
        ${footer(2)}
      `;
    }

    function selectCat(cat) {
      S.category = cat;
      S.questions = cat === 'study' ? QUESTIONS.study.regular : QUESTIONS[cat];
      startTimer();
      if (cat === 'study') renderStudySpecial();
      else renderQuestion();
    }

    function renderStudySpecial() {
      const q = QUESTIONS.study.special;
      document.getElementById('paper').innerHTML = `
        ${header(3, '도파민 영역')}
        <div id="stolen-time" class="stolen-time">⏱ 지금까지 뺏긴 시간: 00:00</div>
        <div class="progress-bar"><div class="progress-bar-inner" style="width:0%"></div></div>
        <div class="question-box">
          <div class="question-num-label">[사전 확인 문항]</div>
          <div class="question-text">${q.text}</div>
        </div>
        <div class="choices-list">
          <button class="choice-btn" onclick="studySpecial('continue')">
            <span class="choice-sym">①</span><span>${q.choices[0]}</span>
          </button>
          <button class="choice-btn" onclick="studySpecial('exit')">
            <span class="choice-sym">②</span><span>${q.choices[1]}</span>
          </button>
        </div>
        ${footer(3)}
      `;
    }

    function studySpecial(choice) {
      if (choice === 'exit') {
        renderStudyWarning();
      } else {
        renderQuestion();
      }
    }

    function renderStudyWarning() {
      stopTimer();
      let n = 5;
      document.getElementById('paper').innerHTML = `
        <div class="warn-wrap">
          <div class="warn-main">공부하러 가세요.</div>
          <div class="warn-sub">지금 당장 책을 펴세요.</div>
          <div class="warn-count" id="wc">${n}초 후 메인으로 이동합니다.</div>
        </div>
      `;
      const iv = setInterval(() => {
        n--;
        const el = document.getElementById('wc');
        if (el) el.textContent = `${n}초 후 메인으로 이동합니다.`;
        if (n <= 0) { clearInterval(iv); resetHome(); }
      }, 1000);
    }

    function resetHome() {
      S.school = S.school; S.nickname = S.nickname;
      S.category = null; S.questions = []; S.qIndex = 0;
      S.answers = []; S.elapsed = 0; S.midLoadingDone = false;
      stopTimer();
      renderIntro();
    }

    function renderQuestion() {
      const q = S.questions[S.qIndex];
      const total = S.questions.length;
      const cur = S.qIndex + 1;
      const pct = (cur / total) * 100;

      // page number: cat selection=2, study special=3 (so study regular starts at 4, others at 3)
      let pg = S.category === 'study' ? 3 + cur : 2 + cur;
      if (S.midLoadingDone) pg += 1; // skip loading page slot

      document.getElementById('paper').innerHTML = `
        ${header(pg, '도파민 영역')}
        <div class="q-meta-row">
          <span>${cur} / ${total} 문항</span>
          <span>${catLabel(S.category)} 카테고리</span>
        </div>
        <div class="progress-bar">
          <div class="progress-bar-inner" style="width:${pct}%"></div>
        </div>
        <div id="stolen-time" class="stolen-time">⏱ 지금까지 뺏긴 시간: ${fmt(S.elapsed)}</div>
        <div class="question-box">
          <div class="question-num-label">문항 ${cur}</div>
          <div class="question-text">${q.text}</div>
        </div>
        <div class="choices-list" id="choices">
          <button class="choice-btn" onclick="answer(0)">
            <span class="choice-sym">①</span><span>${q.choices[0]}</span>
          </button>
          <button class="choice-btn" onclick="answer(1)">
            <span class="choice-sym">②</span><span>${q.choices[1]}</span>
          </button>
        </div>
        ${footer(pg)}
      `;
    }

    function answer(idx) {
      // Disable buttons to prevent double-click
      document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

      const q = S.questions[S.qIndex];
      S.answers.push(q.types[idx]);

      const total = S.questions.length;

      if (S.qIndex === 4 && !S.midLoadingDone) {
        // After 5th question → mid loading
        S.qIndex++;
        S.midLoadingDone = true;
        setTimeout(() => renderLoading(false), 120);
      } else if (S.qIndex === total - 1) {
        // Last question → final loading
        S.qIndex++;
        setTimeout(() => renderLoading(true), 120);
      } else {
        S.qIndex++;
        setTimeout(() => renderQuestion(), 120);
      }
    }

    // Loading waypoints: percent values at elapsed ms
    const WAYPOINTS = [
      [0,    0],
      [900,  38],
      [1700, 73],
      [2300, 82],
      [2700, 24],  // drop
      [3500, 59],
      [4100, 91],
      [4600, 34],  // drop
      [5400, 67],
      [6200, 88],
      [7000, 95],
      [8000, 100],
    ];

    function interpPct(elapsed) {
      for (let i = 0; i < WAYPOINTS.length - 1; i++) {
        const [t0, p0] = WAYPOINTS[i];
        const [t1, p1] = WAYPOINTS[i + 1];
        if (elapsed >= t0 && elapsed <= t1) {
          const r = (elapsed - t0) / (t1 - t0);
          return Math.round(p0 + (p1 - p0) * r);
        }
      }
      return 100;
    }

    function renderLoading(isFinal) {
      const pgNum = isFinal ? (S.category === 'study' ? 15 : 14) : (S.category === 'study' ? 9 : 8);

      document.getElementById('paper').innerHTML = `
        <div class="loading-wrap">
          <div class="loading-subtitle">${isFinal ? '최종 결과를 분석하는 중...' : '중간 분석 중...'}</div>
          <div class="loading-pct" id="lpct">0%</div>
          <div class="loading-bar-outer">
            <div class="loading-bar-inner" id="lbar" style="width:0%"></div>
          </div>
          <div class="loading-msg" id="lmsg">${LOADING_MESSAGES[0]}</div>
        </div>
        ${footer(pgNum)}
      `;

      const TOTAL = 8000;
      let elapsed = 0;
      let msgIdx = 0;

      const iv = setInterval(() => {
        elapsed += 100;

        const p = interpPct(elapsed);
        const pctEl = document.getElementById('lpct');
        const barEl = document.getElementById('lbar');
        if (pctEl) pctEl.textContent = p + '%';
        if (barEl) barEl.style.width = p + '%';

        if (elapsed % 1800 === 0) {
          msgIdx = (msgIdx + 1) % LOADING_MESSAGES.length;
          const msgEl = document.getElementById('lmsg');
          if (msgEl) msgEl.textContent = LOADING_MESSAGES[msgIdx];
        }

        if (elapsed >= TOTAL) {
          clearInterval(iv);
          if (pctEl) pctEl.textContent = '100%';
          if (barEl) barEl.style.width = '100%';
          setTimeout(() => {
            if (isFinal) renderResult();
            else renderQuestion();
          }, 600);
        }
      }, 100);
    }

    function renderResult() {
      stopTimer();
      const res = getResult();
      const mins = toMinutes(S.elapsed);

      const entry = {
        school:   S.school,
        nickname: S.nickname,
        category: catLabel(S.category),
        code:     res.code,
        seconds:  S.elapsed,
        minutes:  mins,
        ts:       Date.now()
      };
      const all  = saveRanking(entry);
      const top5 = all.slice(0, 5);
      const myTs = entry.ts;

      const rowsHTML = top5.length ? top5.map((r, i) => `
        <div class="ranking-row ${r.ts === myTs ? 'rank-me' : ''}">
          <span class="rank-num">${i + 1}</span>
          <span class="rank-info">
            <span>${r.nickname}</span>
            <span class="rank-school">(${r.school})</span>
          </span>
          <span class="rank-time">${r.minutes}분</span>
        </div>
      `).join('') : '<div class="ranking-empty">아직 기록이 없습니다.</div>';

      document.getElementById('paper').innerHTML = `
        ${header(16, '제 최종 교시&nbsp;&nbsp;&nbsp;결과 발표')}
        <div class="result-type-box">
          <div class="result-code">${res.code}</div>
          <div class="result-name">${res.name}</div>
          <div class="result-desc">${res.desc}</div>
        </div>
        <div class="result-meta-grid">
          <div class="meta-card">
            <div class="meta-label">수험생</div>
            <div class="meta-value">${S.nickname}</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">학교</div>
            <div class="meta-value">${S.school}</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">뺏긴 시험시간</div>
            <div class="meta-value stolen-red">${mins}분</div>
          </div>
        </div>
        <div class="ranking-section">
          <div class="ranking-head">🏆 도파민 랭킹 TOP 5 (이 기기 기준)</div>
          ${rowsHTML}
        </div>
        <button class="share-btn" onclick="doShare('${res.code}', ${mins})">📋 결과 공유 문구 복사</button>
        <div class="copy-msg" id="copy-msg"></div>
        <div class="result-actions">
          <button class="btn-act btn-white" onclick="renderCategory()">다른 카테고리 하기</button>
          <button class="btn-act btn-black" onclick="resetHome()">메인으로</button>
        </div>
        ${footer(16)}
      `;
    }

    function doShare(code, mins) {
      const text = `${S.school} ${S.nickname}님의 시험시간은 ${mins}분 뺏겼고, 결과는 ${code}입니다.`;
      const msg = document.getElementById('copy-msg');
      navigator.clipboard.writeText(text)
        .then(() => {
          if (msg) { msg.textContent = '공유 문구가 복사됐습니다!'; setTimeout(() => { if (msg) msg.textContent = ''; }, 3000); }
        })
        .catch(() => {
          if (msg) msg.textContent = text;
        });
    }

    // ══════════════════════════════════════════
    // INIT
    // ══════════════════════════════════════════
    loadUser();
    renderIntro();
  </script>
</body>
